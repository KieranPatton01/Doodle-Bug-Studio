name: Deploy Doodlebug Studio PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies & Build Studio PWA
        working-directory: ./pwa
        env:
          VITE_FIREBASE_API_KEY: AIzaSyB4AZQqe2qWfIhwPow8nB9hok6VgY8ffrM
          VITE_FIREBASE_AUTH_DOMAIN: doodlebug-ddc9c.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: doodlebug-ddc9c
          VITE_WORKER_URL: https://doodlebug-gateway.isingingbanana.workers.dev
          VITE_LIVE_SITE_URL: https://islacowper.co.uk/
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pwa/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
