<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doodle Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #fbfaf5;
      background-image: radial-gradient(#d6d4c8 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .font-hand {
      font-family: 'Caveat', cursive;
    }
  </style>
</head>
<body class="m-0 p-0 w-full min-h-screen relative overflow-x-hidden selection:bg-amber-200">

  <!-- Main Canvas Container -->
  <div class="relative w-full min-h-screen">

    <!-- Top Yellow Sticky Note / Tag -->
    <div class="absolute top-[2%] left-[13%] z-30">
      <div class="bg-[#fef4b7] border border-[#f2d770] text-[#1c1917] px-6 py-2 rounded-2xl shadow-sm text-center transform -rotate-1">
        <span class="font-hand text-2xl tracking-wide select-none">etghdgh</span>
      </div>
    </div>

    <!-- Hand-drawn Gray Doodle Lines (SVG) -->
    <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 400 820" preserveAspectRatio="none" fill="none">
      <!-- Gray curving doodle path matching canvas -->
      <path d="M 264 125 
               C 320 150, 420 280, 390 470 
               C 365 620, 260 700, 305 765 
               C 315 780, 290 770, 275 745 
               C 210 640, 160 410, 160 410 
               C 220 540, 240 680, 310 700 
               C 380 720, 380 500, 250 380 
               C 200 330, 130 520, 80 690" 
            stroke="#9fa4a6" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      
      <!-- Small gray dot near bottom center -->
      <circle cx="200" cy="755" r="3.5" fill="#9fa4a6" />
    </svg>

    <!-- Polaroid-style Photo Frame with Kitten GIF -->
    <div class="absolute top-[18%] left-[23%] z-20">
      <div class="bg-white p-2 pb-6 shadow-[0_4px_16px_rgba(0,0,0,0.08)] border border-neutral-100 rounded-sm w-[142px]">
        <div class="w-full aspect-square overflow-hidden bg-neutral-100">
          <img 
            src="https://media.giphy.com/media/WXaSmAhW1uS3IwtDBa/giphy.gif" 
            alt="Cat strongly disagree" 
            class="w-full h-full object-cover block select-none pointer-events-none" 
            draggable="false"
          />
        </div>
      </div>
    </div>

    <!-- Sparkles Sticker Composition -->
    <div class="absolute top-[48%] left-[43%] z-30 select-none pointer-events-none">
      <div class="relative w-16 h-16">
        <!-- Main Gold 4-Point Star -->
        <svg class="absolute top-0 left-0 w-12 h-12 text-[#f6c31a] drop-shadow-sm" viewBox="0 0 100 100" fill="currentColor" stroke="#9a7206" stroke-width="4">
          <path d="M 50 0 Q 50 50 100 50 Q 50 50 50 100 Q 50 50 0 50 Q 50 50 50 0 Z" />
        </svg>
        
        <!-- Pink Smaller 4-Point Star -->
        <svg class="absolute top-4 left-7 w-8 h-8 text-[#f9f3f7]" viewBox="0 0 100 100" fill="#fff" stroke="#e62e7b" stroke-width="7">
          <path d="M 50 0 Q 50 50 100 50 Q 50 50 50 100 Q 50 50 0 50 Q 50 50 50 0 Z" />
        </svg>

        <!-- Tiny Mint Green Circle Sticker Accent -->
        <div class="absolute top-8 -left-3 w-2.5 h-2.5 rounded-full border-2 border-[#10b981] bg-[#d1fae5]"></div>
      </div>
    </div>

  </div>


  <!-- Doodlebug Auto-Resizing Protocol -->
  <script>
    (function() {
      function notifyParent() {
        var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'doodle-resize', height: h }, '*');
        }
      }
      window.addEventListener('load', notifyParent);
      window.addEventListener('resize', notifyParent);
      if (window.ResizeObserver) {
        new ResizeObserver(notifyParent).observe(document.body);
      }
      setTimeout(notifyParent, 500);
    })();
  </script>
</body>
</html>
