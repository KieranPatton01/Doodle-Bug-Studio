<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doodlebug</title>
  <!-- PWA Meta Tags & Manifest -->
  <meta name="theme-color" content="#FFFDF5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Site" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1c1917;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(255, 253, 245, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--stone-line, #E7E5E4);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: #292524;
    }
    .header-brand .logo-icon {
      font-size: 1.35rem;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 9999px;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    main {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }
    .stage-wrapper {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      box-shadow: 0 4px 25px -4px rgba(0, 0, 0, 0.06);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--stone-line, #E7E5E4);
    }
    #doodle-stage {
      width: 100%;
      min-height: 400px;
      border: none;
      display: block;
    }
    footer {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-brand">
      <span class="logo-icon">🐛</span>
      <span>Doodlebug</span>
    </div>
    <div class="header-badge" id="update-badge" title="Last updated time">
      <span id="update-time">Last updated</span>
    </div>
  </header>

  <main>
    <div class="stage-wrapper">
      <iframe
        src="canvas.html"
        id="doodle-stage"
        sandbox="allow-scripts allow-modals allow-popups"
        scrolling="no"
        loading="eager"
        title="Doodlebug Canvas"
      ></iframe>
    </div>
  </main>

  <footer style="display: none;"></footer>

  <script src="iframe-resizer.js"></script>
  <script>
    (function() {
      const badgeText = document.getElementById('update-time');
      if (!badgeText) return;

      function timeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return 'Just now';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        const days = Math.floor(hours / 24);
        if (days === 1) return 'Yesterday';
        if (days < 30) return `${days}d ago`;
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }

      fetch('https://api.github.com/repos/kieranpatton01/DoodleBug/commits?path=canvas.html&page=1&per_page=1')
        .then(function(res) {
          if (!res.ok) throw new Error();
          return res.json();
        })
        .then(function(commits) {
          if (commits && commits[0] && commits[0].commit && commits[0].commit.committer) {
            const date = new Date(commits[0].commit.committer.date);
            badgeText.textContent = 'Last updated ' + timeAgo(date);
          }
        })
        .catch(function() {
          try {
            const mod = new Date(document.lastModified);
            if (!isNaN(mod.getTime()) && mod.getFullYear() > 2020) {
              badgeText.textContent = 'Last updated ' + timeAgo(mod);
            } else {
              badgeText.textContent = 'Last updated';
            }
          } catch(e) {
            badgeText.textContent = 'Last updated';
          }
        });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
